    <!-- +++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++

    <div class="back-to-home">
       <a href="../index.html"><i class="fas fa-arrow-left back-to-home-arrow"></i> Back to Home</a>
    </div>

    <div class="whole-bot-cont">
        <div class="the-head" data-aos="fade-up" data-aos-duration="1000">
            <h2>I'm Here for You <span>&#60;3</span></h2>
            <p>Talk to me about anything that's on your mind</p>

        <div class="bot-cont" data-aos="fade-up" data-aos-delay="200">

            <div class="chat-interface">
                <div class="chat-messages" id="chat-messages">
                    <div class="message bot-message">
                        <p>Hello! I'm here to listen and chat with you. How are you feeling today?</p>
                    </div>
                </div>

                    <p class="user-speech"></p>
                    <p class="listening-text">Listening...</p>
                </div>
            </div>
        </div>

        <div class="bot-page-btns" data-aos="fade-up" data-aos-delay="300">
            <div class="start-convo-btn-cont">
                <button class="start-convo-btn btn">Start Conversation</button>
            </div>

    <script src="../otherJS/footer.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize AOS
            AOS.init({
                duration: 800,
                easing: 'ease-in-out',
                once: true,
                mirror: false
            });
            
            // Add typing animation to bot messages
            function addTypingAnimation() {
                const typingDiv = document.createElement('div');
                typingDiv.className = 'message bot-message typing';
                
                for (let i = 0; i < 3; i++) {
                    const dot = document.createElement('span');
                    typingDiv.appendChild(dot);
                }
                
                document.getElementById('chat-messages').appendChild(typingDiv);
                
                // Scroll to bottom
                const chatMessages = document.getElementById('chat-messages');
                chatMessages.scrollTop = chatMessages.scrollHeight;
                
                return typingDiv;
            }
            
            // Remove typing animation
            function removeTypingAnimation(element) {
                if (element && element.parentNode) {
                    element.parentNode.removeChild(element);
                }
            }
            
            // Override the original addBotMessage function
            const originalAddBotMessage = window.addBotMessage;
            if (originalAddBotMessage) {
                window.addBotMessage = function(message) {
                    const typingIndicator = addTypingAnimation();
                    
                    // Simulate typing delay
                    setTimeout(() => {
                        removeTypingAnimation(typingIndicator);
                        originalAddBotMessage(message);
                        
                        // Scroll to bottom
                        const chatMessages = document.getElementById('chat-messages');
                        chatMessages.scrollTop = chatMessages.scrollHeight;
                    }, 1500);
                };
            }
        });
    </script>
